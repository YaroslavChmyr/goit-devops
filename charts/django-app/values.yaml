# Default values for django-app
# This is a YAML-formatted file.

replicaCount: 2

image:
  repository: ""  # Will be set to ECR repository URL
  tag: "latest"
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext: {}

securityContext: {}

service:
  type: LoadBalancer
  port: 80
  targetPort: 8000

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  tls: []

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

# Environment variables for Django application
env:
  DEBUG: "False"
  SECRET_KEY: ""  # Set via Kubernetes secret in production
  ALLOWED_HOSTS: "*"
  DATABASE_URL: ""  # Configure based on your database setup
  CORS_ALLOWED_ORIGINS: ""  # Configure based on your frontend
  REDIS_URL: ""  # Configure based on your Redis setup
  EMAIL_BACKEND: "django.core.mail.backends.console.EmailBackend"
  STATIC_URL: "/static/"
  MEDIA_URL: "/media/"
  LOG_LEVEL: "INFO"
